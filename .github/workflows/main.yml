name: Build AcidSynth

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: AcidSynth-Windows
          path: |
            build/AcidSynth_artefacts/Release/VST3/
            build/AcidSynth_artefacts/Release/Standalone/
